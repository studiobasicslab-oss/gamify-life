  <!-- Border -->
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#2d2740" stroke-width="4" rx="8" />
  <!-- Crown Pixel Art -->
  <rect x="16" y="24" width="32" height="24" fill="#fcd34d" />
  <rect x="20" y="20" width="8" height="4" fill="#fcd34d" />
  <rect x="36" y="20" width="8" height="4" fill="#fcd34d" />
  <rect x="16" y="16" width="4" height="8" fill="#fcd34d" />
  <rect x="30" y="14" width="4" height="10" fill="#fcd34d" />
  <rect x="44" y="16" width="4" height="8" fill="#fcd34d" />
  <!-- Gems -->
  <rect x="20" y="32" width="4" height="4" fill="#ef4444" />
  <rect x="30" y="32" width="4" height="4" fill="#3b82f6" />
  <rect x="40" y="32" width="4" height="4" fill="#10b981" />
